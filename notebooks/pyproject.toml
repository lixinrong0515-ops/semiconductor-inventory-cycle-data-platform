[project]
name = "notebooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xinrong", email = "lixinrong0515@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "dotenv>=0.9.9",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
]

[project.scripts]
notebooks = "notebooks:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
